site_name: Awesome IAM Labs
site_description: Practical identity engineering, from first principles to enterprise operations.
site_url: https://iam-kamran.github.io/awesome-iam-labs/
repo_url: https://github.com/iam-kamran/awesome-iam-labs
repo_name: iam-kamran/awesome-iam-labs
edit_uri: edit/main/
docs_dir: .
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - docs/assets/extra.css

nav:
  - Home: index.md
  - Start Here:
      - Identity Foundations: 01-IAM-Identity-Foundations-Workbook.md
      - Enterprise IAM Curriculum: 02-Enterprise-IAM-Lab-Curriculum.md
  - Platform Guides:
      - Microsoft Entra SC-300: 04-Microsoft-Entra-SC300-Master-Guide.md
      - Okta Administrator: 05-Okta-Certified-Administrator-Roadmap.md
      - SailPoint IdentityIQ: 08-SailPoint-IIQ-Enterprise-25-Lab-Roadmap.md
  - Operations & Engineering:
      - First Responder Labs: 06-IAM-First-Responder-Labs.md
      - CI/CD & Workload Identity: 07-CICD-Workload-Identity-Labs.md
      - Entra Portal vs Graph: 09-Entra-Portal-Limitations-vs-PowerShell-Graph.md
      - Graph PowerShell Toolkit: 10-entra_iam_microsoft_graph_toolkit.md
  - Architecture Diagrams:
      - SAML, OIDC & Lifecycle: docs/architecture/identity-flows.md
  - Career:
      - Interview Question Bank: 03-IAM-Interview-Question-Bank.md
  - Contributing: CONTRIBUTING.md

exclude_docs: |
  CHANGELOG.md
  LICENSE
  mkdocs.yml
  .github/
  docs/
  site/
