site_name: Awesome IAM Labs
site_description: Practical identity engineering, from first principles to enterprise operations.
site_url: https://blog.ansari.solutions/
repo_url: https://github.com/iam-kamran/awesome-iam-labs
repo_name: iam-kamran/awesome-iam-labs
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - assets/mermaid-init.js

nav:
  - Home: index.md
  - Start Here:
      - Identity Foundations: guides/01-IAM-Identity-Foundations-Workbook.md
      - Enterprise IAM Curriculum: guides/02-Enterprise-IAM-Lab-Curriculum.md
  - Platform Guides:
      - Microsoft Entra SC-300: guides/04-Microsoft-Entra-SC300-Master-Guide.md
      - Okta Administrator: guides/05-Okta-Certified-Administrator-Roadmap.md
      - SailPoint IdentityIQ: guides/08-SailPoint-IIQ-Enterprise-25-Lab-Roadmap.md
  - Hands-on Labs:
      - Lab Hub: labs/README.md
      - Field Lab Workbook: labs/field-lab-workbook.md
      - First Responder: guides/06-IAM-First-Responder-Labs.md
      - Workload Identity: guides/07-CICD-Workload-Identity-Labs.md
      - Graph PowerShell: guides/10-entra_iam_microsoft_graph_toolkit.md
  - Architecture:
      - Identity Flows: architecture/identity-flows.md
      - Enterprise Patterns: architecture/platform-patterns.md
  - Operations & Engineering:
      - Entra Portal vs Graph: guides/09-Entra-Portal-Limitations-vs-PowerShell-Graph.md
  - Career:
      - Interview Question Bank: guides/03-IAM-Interview-Question-Bank.md
