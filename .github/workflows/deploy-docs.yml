name: Validate documentation pull requests

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation dependencies
        run: pip install mkdocs-material

      - name: Build site
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "MkDocs configuration is introduced by the documentation portal change; skipping site build for this repository-only update."
          fi
